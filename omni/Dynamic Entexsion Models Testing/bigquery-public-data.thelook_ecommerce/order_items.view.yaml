# Reference this view as bigquery_public_data_thelook_ecommerce__order_items
description: Programatically generated order items for The Look fictitious e-commerce store

catalog: bigquery-public-data
schema: thelook_ecommerce
table_name: order_items

dimensions:
  status: {}
  created_at: {}
  shipped_at: {}
  delivered_at: {}
  returned_at: {}
  sale_price: {}

  id:
    format: ID
    primary_key: true

  order_id:
    format: ID

  user_id:
    format: ID

  product_id:
    format: ID

  inventory_item_id:
    format: ID

measures:
  count:
    aggregate_type: count

  total_revenue:
    sql: ${bigquery_public_data_thelook_ecommerce__order_items.sale_price}
    aggregate_type: sum
