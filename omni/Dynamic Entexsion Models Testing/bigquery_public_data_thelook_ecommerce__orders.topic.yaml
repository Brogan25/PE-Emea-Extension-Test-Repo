    bigquery_public_data_thelook_ecommerce__orders.status,
    bigquery_public_data_thelook_ecommerce__orders.count,
    bigquery_public_data_thelook_ecommerce__products.name,
    bigquery_public_data_thelook_ecommerce__products.brand,
    bigquery_public_data_thelook_ecommerce__products.category,
